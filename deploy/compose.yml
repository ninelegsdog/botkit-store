name: botkit-store

services:
  bot:
        image: ghcr.io/ninelegsdog/botkit-store:${IMAGE_TAG:-main}
    container_name: botkit-store
    user: "1001:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      default:
        aliases:
          - botkit-store
    ports:
      - "127.0.0.1:{METRICS_PORT}:{METRICS_PORT}"
    environment:
      - METRICS_PORT=${METRICS_PORT}
      - BIND_HOST=0.0.0.0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - WEBHOOK_SECRET_TOKEN=${TELEGRAM_WEBHOOK_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_CERT_PATH=/app/certs/fullchain.pem
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_IDS=${ADMIN_IDS}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=sqlite+aiosqlite:///./data/bot.db
      - DB_PATH=./data/bot.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces
    volumes:
      - ../data:/app/data
      - ../backups:/app/backups
      - /home/deploy/reverse-proxy/certs/fullchain.pem:/app/certs/fullchain.pem:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,socket; urllib.request.urlopen('http://localhost:${METRICS_PORT}/health',timeout=2); socket.create_connection(('127.0.0.1',6380),5).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 1g

networks:
  default:
    name: botkit_store
    external: true
