name: deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy to vps
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            BOT="botkit-store"
            PORT=8088
            BUILD_DIR=/home/deploy/$BOT
            ENV_FILE=/home/algtro/BOTOGRAD_TECH/$BOT/.env
            IMAGE=botkit/$BOT:latest
            PREV="${IMAGE%latest}prev"
            # snapshot current production image for rollback
            docker tag "$IMAGE" "$PREV" 2>/dev/null || true
            # refresh source from github main
            if [ -d "$BUILD_DIR/.git" ]; then
              cd "$BUILD_DIR"
              git fetch origin
              git checkout -f origin/main
              git reset --hard origin/main
            else
              git clone --depth 1 -b main "https://github.com/ninelegsdog/$BOT.git" "$BUILD_DIR"
            fi
            # build new image
            docker build --build-arg PORT=$PORT -t "$IMAGE" "$BUILD_DIR"
            # replace running container
            docker rm -f "$BOT" || true
            mkdir -p /opt/botkit/data/$BOT
            docker run -d --name "$BOT" --network botnet --restart unless-stopped --user 1001:1001 --read-only --cap-drop ALL --security-opt no-new-privileges:true -p "${PORT}:${PORT}" -v /opt/botkit/data/$BOT:/data -e PORT=$PORT --env-file "$ENV_FILE" "$IMAGE"
            # health check
            ok=0
            for i in $(seq 1 12); do
              if curl -fs "http://127.0.0.1:${PORT}/health"; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" -eq 0 ]; then
              echo "Health check failed. Rolling back to $PREV"
              docker rm -f "$BOT" || true
              docker run -d --name "$BOT" --network botnet --restart unless-stopped --user 1001:1001 --read-only --cap-drop ALL --security-opt no-new-privileges:true -p "${PORT}:${PORT}" -v /opt/botkit/data/$BOT:/data -e PORT=$PORT --env-file "$ENV_FILE" "$PREV"
              exit 1
            fi
            echo "Deploy of $BOT OK"
