name: deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PORT: 8088
      BOT: botkit-store
    steps:
      - uses: actions/checkout@v4

      - name: require green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            concl=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --workflow ci.yml --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null || true)
            if [ "$concl" = "success" ]; then echo "CI green for $GITHUB_SHA"; exit 0; fi
            if [ "$concl" = "failure" ] || [ "$concl" = "cancelled" ] || [ "$concl" = "timed_out" ]; then
              echo "CI is RED ($concl) for $GITHUB_SHA - abort deploy"; exit 1
            fi
            echo "CI status='${concl:-none}' yet, waiting..."; sleep 15
          done
          echo "CI status unknown for $GITHUB_SHA after timeout - abort deploy"; exit 1

      - name: setup ssh key
        run: |
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key

      - name: build image
        run: docker build --build-arg PORT=${{ env.PORT }} -t botkit-deploy-${{ env.BOT }}:local .

      - name: transfer image to vps
        run: |
          docker save botkit-deploy-${{ env.BOT }}:local | ssh -o StrictHostKeyChecking=no -i /tmp/vps_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'docker load'

      - name: run on vps
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            BOT="${{ env.BOT }}"
            PORT=${{ env.PORT }}
            TAG="${{ github.ref_name }}"
            TAG="${TAG#v}"
            [ -z "$TAG" ] && TAG="${{ github.sha }}"
            IMAGE=botkit/${BOT}:${TAG}
            ENV_FILE=/home/algtro/BOTOGRAD_TECH/${BOT}/.env
            OLD_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$BOT" 2>/dev/null || true)
            docker tag botkit-deploy-${BOT}:local "$IMAGE"
            docker rm -f "$BOT" || true
            mkdir -p /opt/botkit/data/${BOT}
            docker run -d --name "$BOT" --network botnet --restart unless-stopped --user 1001:1001 --read-only --cap-drop ALL --security-opt no-new-privileges:true -p "${PORT}:${PORT}" -v /opt/botkit/data/${BOT}:/data -e PORT=$PORT --env-file "$ENV_FILE" "$IMAGE"
            ok=0
            for i in $(seq 1 12); do
              if curl -fs "http://127.0.0.1:${PORT}/health"; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" -eq 0 ]; then
              docker rm -f "$BOT" || true
              if [ -n "$OLD_IMAGE" ]; then
                docker run -d --name "$BOT" --network botnet --restart unless-stopped --user 1001:1001 --read-only --cap-drop ALL --security-opt no-new-privileges:true -p "${PORT}:${PORT}" -v /opt/botkit/data/${BOT}:/data -e PORT=$PORT --env-file "$ENV_FILE" "$OLD_IMAGE"
              fi
              echo "HEALTH FAILED - rolled back to $OLD_IMAGE"; exit 1
            fi
            DEPLOYED_ID=$(docker inspect --format '{{.Id}}' "$IMAGE")
            RUN_ID=$(docker inspect --format '{{.Image}}' "$BOT")
            if [ "$DEPLOYED_ID" != "$RUN_ID" ]; then
              echo "DIGEST MISMATCH: container runs $RUN_ID but deployed $DEPLOYED_ID"; exit 1
            fi
            echo "Deploy of $BOT OK (image $DEPLOYED_ID)"
