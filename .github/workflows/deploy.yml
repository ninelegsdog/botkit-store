name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.repository }}
  cancel-in-progress: false

env:
  BOT: ${{ github.event.repository.name }}
  PORT: ${{ vars.PORT }}
  VERSION: ${{ vars.VERSION }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" || pip install pytest pytest-cov
      - name: Test
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${BOT}:${VERSION} .

      - name: Save image
        run: docker save ${BOT}:${VERSION} | gzip > /tmp/${BOT}.tar.gz

      - name: Setup SSH to prod
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 2.27.204.95 >> ~/.ssh/known_hosts

      - name: Transfer image to prod
        run: scp -o StrictHostKeyChecking=no /tmp/${BOT}.tar.gz root@2.27.204.95:/tmp/${BOT}.tar.gz

      - name: Load image + prepare dirs on prod
        run: |
          ssh root@2.27.204.95 "
            docker load < /tmp/${BOT}.tar.gz && rm -f /tmp/${BOT}.tar.gz
            mkdir -p /home/deploy/${BOT}/data && chmod 777 /home/deploy/${BOT}/data
            mkdir -p /home/deploy/${BOT}/backups
          "

      - name: Render compose from template
        run: |
          sed -e "s/__BOT__/${BOT}/g" -e "s/__VERSION__/${VERSION}/g" -e "s/__PORT__/${PORT}/g" deploy/compose.template.yml > /tmp/compose.yml
          scp -o StrictHostKeyChecking=no /tmp/compose.yml root@2.27.204.95:/home/deploy/${BOT}/compose.yml

      - name: Render .env from secrets
        run: |
          cat > /tmp/${BOT}.env <<EOF
          METRICS_PORT=${PORT}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WEBHOOK_SECRET_TOKEN=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ADMIN_IDS=${{ secrets.ADMIN_IDS }}
          REDIS_URL=redis://redis:6379/0
          DATABASE_URL=sqlite+aiosqlite:///./data/bot.db
          DB_PATH=./data/bot.db
          EOF
          scp -o StrictHostKeyChecking=no /tmp/${BOT}.env root@2.27.204.95:/home/deploy/${BOT}/.env

      - name: Deploy
        run: ssh root@2.27.204.95 "cd /home/deploy/${BOT} && docker compose up -d"

      - name: Healthcheck
        run: |
          sleep 15
          ssh root@2.27.204.95 "curl -f http://localhost:${PORT}/health"
