name: CI
on: [push, pull_request, workflow_call]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - name: Configure git auth for private botkit-core
        env:
          BOTKIT_CORE_TOKEN: ${{ secrets.BOTKIT_CORE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${BOTKIT_CORE_TOKEN}@github.com/ninelegsdog/botkit-core".insteadOf "https://github.com/ninelegsdog/botkit-core"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/
      - run: pytest --cov=src --cov-report=term-missing

      # Pre-commit checks
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - name: Install pre-commit and gitleaks
        run: |
          pip install pre-commit
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          mkdir -p /tmp/bin && mv /tmp/gitleaks /tmp/bin/
          echo "/tmp/bin" >> "$GITHUB_PATH"
      - name: Run pre-commit
        run: pre-commit run --all-files

      # Version drift check
      - name: Version drift check
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "Version not found in pyproject.toml"
            exit 1
          fi
          echo "Package version: $VERSION"
          echo "Version drift check passed for $VERSION"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      
      # Gitleaks
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
      
      # Trivy filesystem scan
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8  # v3.28.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-fs.sarif"
      
      # SBOM generation
      - name: Generate SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5  # v0.17.0
        with:
          path: "."
          format: "spdx-json"
          output-file: "sbom.spdx.json"
      - name: Publish SBOM to Dependency Graph
        uses: anchore/sbom-action/publish-sbom@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5  # v0.17.0
        with:
          sbom-artifact-match: "sbom.spdx.json"
