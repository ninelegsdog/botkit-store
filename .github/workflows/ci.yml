name: CI
on: [push, pull_request, workflow_call]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.0.0
        with:
          python-version: "3.12"
      - name: Configure git auth for private botkit-core
        env:
          BOTKIT_CORE_TOKEN: ${{ secrets.BOTKIT_CORE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${BOTKIT_CORE_TOKEN}@github.com/ninelegsdog/botkit-core".insteadOf "https://github.com/ninelegsdog/botkit-core"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/
      - run: pytest --cov=src --cov-report=term-missing

      # Pre-commit checks
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit and gitleaks
        run: |
          pip install pre-commit
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          mkdir -p /tmp/bin && mv /tmp/gitleaks /tmp/bin/
          echo "/tmp/bin" >> "$GITHUB_PATH"
      - name: Run pre-commit
        run: pre-commit run --all-files

      # Version drift check
      - name: Version drift check
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "Version not found in pyproject.toml"
            exit 1
          fi
          echo "Package version: $VERSION"
          echo "Version drift check passed for $VERSION"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0
        with:
          fetch-depth: 0
      
      # Gitleaks
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
      
      # Trivy filesystem scan
      - name: Trivy filesystem scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivybin
          /tmp/trivybin/trivy fs --severity CRITICAL,HIGH --exit-code 1 --format sarif --output trivy-fs.sarif .
      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939  # v4.0.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-fs.sarif"
      
      # SBOM generation
      - name: Generate SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3  # v0.24.2
        with:
          path: "."
          format: "spdx-json"
          output-file: "sbom.spdx.json"
      - name: Publish SBOM to Dependency Graph
        uses: anchore/sbom-action/publish-sbom@006b7ce8314066bdf1765b4500370d40fa6917a3  # v0.24.2
        with:
          sbom-artifact-match: "sbom.spdx.json"

  load-test:
    runs-on: ubuntu-latest
    needs: check
    if: false  # Manual only for now, k6 sanity 100 RPS
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0
      - name: Setup k6
        uses: grafana/setup-k6-action@v1  # v1
      - name: Validate k6 script
        run: k6 run --vus 1 --iterations 1 load-test.js --out /dev/null || echo "k6 script valid (no server, expected fail)"
