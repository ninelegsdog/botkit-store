name: CI
on: [push, pull_request, workflow_call]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b5c6ecbdb5895b57d5622c74b8e653c2f42d69e  # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/
      - run: pytest --cov=src --cov-report=term-missing

      # Pre-commit checks
      - uses: actions/setup-python@0b5c6ecbdb5895b57d5622c74b8e653c2f42d69e  # v5.4.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files

      # Version drift check
      - name: Version drift check
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "Version not found in pyproject.toml"
            exit 1
          fi
          echo "Package version: $VERSION"
          echo "Version drift check passed for $VERSION"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      
      # Gitleaks
      - uses: gitleaks/gitleaks-action@3b2f6e4c4c1b8c4d5e6f7a8b9c0d1e2f3a4b5c6d  # v2.6.1
      
      # Trivy filesystem scan
      - uses: aquasecurity/trivy-action@1f3e9c1e8a4a8f3b8e7c9d0a1b2c3d4e5f6a7b8c9  # v0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@44c1b5c7d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0  # v3.28.0
        if: always()
        with:
          sarif_file: "trivy-fs.sarif"
      
      # SBOM generation
      - name: Generate SBOM
        uses: anchore/sbom-action@0e8c7e5a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e  # v0.17.0
        with:
          path: "."
          format: "spdx-json"
          output-file: "sbom.spdx.json"
      - name: Upload SBOM
        uses: github/dependency-graph-action@v1
        with:
          path: "sbom.spdx.json"
