name: CI
on: [push, pull_request, workflow_call]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/
      - run: pytest --cov=src --cov-report=term-missing

      # Pre-commit checks
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit and gitleaks
        run: |
          pip install pre-commit
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_checksums.txt -o /tmp/gitleaks_checksums.txt
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          expected=$(awk -v f="gitleaks_8.18.0_linux_x64.tar.gz" '{n=$2; sub(/^\*/,"",n); if (n==f) print $1}' /tmp/gitleaks_checksums.txt)
          echo "$expected  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          mkdir -p /tmp/bin && mv /tmp/gitleaks /tmp/bin/
          echo "/tmp/bin" >> "$GITHUB_PATH"
      - name: Run pre-commit
        run: pre-commit run --all-files

      # Version drift check
      - name: Version drift check
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "Version not found in pyproject.toml"
            exit 1
          fi
          echo "Package version: $VERSION"
          echo "Version drift check passed for $VERSION"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
        with:
          fetch-depth: 0
      
      # Gitleaks
      # Gitleaks: gitleaks-action v3 (а) требует явный GITHUB_TOKEN для PR-сканов,
      # (б) проверку лицензии делает неаутентифицированным запросом к api.github.com -
      # на общих runner'ах тот ловит rate limit и роняет джоб с 'missing gitleaks license'.
      # Обязательный чек должен быть детерминированным, поэтому та же проверка
      # пинненной версией CLI, без обращений к API; SARIF уходит в code scanning.
      - name: Gitleaks scan
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt -o /tmp/gitleaks_checksums.txt
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          expected=$(awk -v f="gitleaks_8.24.3_linux_x64.tar.gz" '{n=$2; sub(/^\*/,"",n); if (n==f) print $1}' /tmp/gitleaks_checksums.txt)
          echo "$expected  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --report-format sarif --report-path gitleaks.sarif
      - name: Upload Gitleaks results
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939  # v4.0.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: gitleaks.sarif
      
      # Trivy filesystem scan
      - name: Trivy filesystem scan
        run: |
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_checksums.txt -o /tmp/trivy_checksums.txt
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o /tmp/trivy.tgz
          expected=$(awk -v f="trivy_0.75.0_Linux-64bit.tar.gz" '{n=$2; sub(/^\*/,"",n); if (n==f) print $1}' /tmp/trivy_checksums.txt)
          echo "$expected  /tmp/trivy.tgz" | sha256sum -c -
          mkdir -p /tmp/trivybin && tar -xzf /tmp/trivy.tgz -C /tmp/trivybin trivy
          /tmp/trivybin/trivy fs --severity CRITICAL,HIGH --exit-code 1 --format sarif --output trivy-fs.sarif .
      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939  # v4.0.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-fs.sarif"
      
      # SBOM generation
      - name: Generate SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3  # v0.24.2
        with:
          path: "."
          format: "spdx-json"
          output-file: "sbom.spdx.json"
      - name: Publish SBOM to Dependency Graph
        uses: anchore/sbom-action/publish-sbom@006b7ce8314066bdf1765b4500370d40fa6917a3  # v0.24.2
        with:
          sbom-artifact-match: "sbom.spdx.json"

  load-test:
    runs-on: ubuntu-latest
    needs: check
    if: false  # Manual only for now, k6 sanity 100 RPS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1  # v1  # v1
      - name: Validate k6 script
        run: k6 run --vus 1 --iterations 1 load-test.js --out /dev/null || echo "k6 script valid (no server, expected fail)"
