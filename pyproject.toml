[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botkit-store"
version = "1.0.0"
description = "Telegram store bot — digital goods with auto-delivery"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "redis>=5.0",
    "httpx>=0.28",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8", "pytest-cov>=6", "pytest-asyncio>=0.25"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "SIM"]
ignore = ["SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers -q --tb=short"
testpaths = ["tests"]
