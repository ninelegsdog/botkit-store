[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botkit-store"
version = "1.0.0"
description = "Telegram store bot — digital goods with auto-delivery"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "redis>=5.0",
    "httpx>=0.28",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "botkit-core @ git+https://github.com/ninelegsdog/botkit-core@v0.1.2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8", "pytest-cov>=6", "pytest-asyncio>=0.25", "pytest-xdist>=3.6", "aiohttp>=3.9", "requests>=2.31"]
e2e = ["telethon>=1.34", "python-dotenv>=1.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "SIM"]
ignore = ["SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=70"
markers = [
    "no_req: fully offline, no external HTTP/Telegram requests",
    "req: requires network and/or a real external service (Telegram E2E, payment gateways)",
    "unit: isolated unit test",
    "integration: local component/integration test",
    "webhook: HTTP/webhook endpoint test",
    "e2e: real Telegram E2E via MTProto",
    "serial: must not run in parallel via xdist",
]

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true
omit = ["tests/*", "scripts/*", "src/bot.py", "src/core/tgwebhook.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 67
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.coverage.xml]
output = "coverage.xml"
