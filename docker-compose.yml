version: "3.8"

services:
  bot:
    image: botkit-store:1.0.0
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8083:8083"
    read_only: true
    user: 1001:1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - bot-data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 100
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  bot-data:
